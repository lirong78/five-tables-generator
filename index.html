<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五表一书生成器 - 员工负荷表</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 { font-size: 28px; margin-bottom: 8px; }
        .header p { opacity: 0.9; font-size: 14px; }
        .content { padding: 30px; }
        
        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #f8f9ff;
        }
        .upload-area:hover, .upload-area.dragover {
            border-color: #764ba2;
            background: #f0f2ff;
            transform: scale(1.02);
        }
        .upload-area .icon { font-size: 48px; margin-bottom: 16px; }
        .upload-area h3 { color: #333; margin-bottom: 8px; }
        .upload-area p { color: #666; font-size: 14px; }
        #fileInput { display: none; }
        
        .options {
            margin-top: 24px;
            padding: 20px;
            background: #f8f9ff;
            border-radius: 8px;
        }
        .options h4 { color: #333; margin-bottom: 12px; }
        .form-row { display: flex; gap: 16px; margin-bottom: 12px; flex-wrap: wrap; }
        .form-group { flex: 1; min-width: 150px; }
        .form-group label { display: block; font-size: 13px; color: #555; margin-bottom: 4px; }
        .form-group input, .form-group select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        
        .btn {
            display: inline-block;
            padding: 12px 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        
        .result {
            margin-top: 24px;
            padding: 20px;
            background: #e8f5e9;
            border-radius: 8px;
            display: none;
        }
        .result.show { display: block; }
        .result.error { background: #ffebee; }
        .result h4 { color: #2e7d32; margin-bottom: 8px; }
        .result.error h4 { color: #c62828; }
        .result .download-btn {
            display: inline-block;
            margin-top: 12px;
            padding: 8px 20px;
            background: #2e7d32;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
        }
        
        .preview { margin-top: 24px; display: none; }
        .preview.show { display: block; }
        .preview h4 { color: #333; margin-bottom: 12px; }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 16px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-card .value { font-size: 24px; font-weight: bold; }
        .stat-card .label { font-size: 12px; opacity: 0.9; margin-top: 4px; }
        
        .chart-container {
            background: #f8f9ff;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .chart-container h4 { margin-bottom: 12px; color: #333; }
        .chart-wrapper { position: relative; height: 300px; }
        
        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            overflow-x: auto;
            display: block;
        }
        .data-table table { width: 100%; min-width: 600px; }
        .data-table th, .data-table td {
            border: 1px solid #ddd;
            padding: 6px 8px;
            text-align: center;
        }
        .data-table th { background: #667eea; color: white; }
        .data-table tr:nth-child(even) { background: #f8f9ff; }
        
        .footer {
            text-align: center;
            padding: 20px;
            color: #999;
            font-size: 12px;
            border-top: 1px solid #eee;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 员工负荷表生成器</h1>
            <p>上传作业指导书Excel，自动生成员工负荷表（含山积图）</p>
        </div>
        
        <div class="content">
            <div class="upload-area" id="uploadArea">
                <div class="icon">📁</div>
                <h3>点击或拖拽上传作业指导书</h3>
                <p>支持 .xlsx 格式，每个Sheet代表一个工位</p>
            </div>
            <input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none">
            
            <div class="options">
                <h4>⚙️ 配置信息（可选）</h4>
                <div class="form-row">
                    <div class="form-group">
                        <label>车间名称</label>
                        <input type="text" id="workshop" value="地刷车间">
                    </div>
                    <div class="form-group">
                        <label>线体名称</label>
                        <input type="text" id="lineName" value="地刷充电座线">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>产品型号</label>
                        <input type="text" id="productModel" placeholder="自动识别">
                    </div>
                    <div class="form-group">
                        <label>编制人</label>
                        <input type="text" id="author" value="邓豪">
                    </div>
                </div>
            </div>
            
            <button class="btn" id="generateBtn" disabled>🚀 生成员工负荷表</button>
            
            <div class="result" id="result">
                <h4 id="resultTitle">✅ 生成成功!</h4>
                <div id="resultInfo"></div>
                <a class="download-btn" id="downloadLink" href="#" download>📥 下载员工负荷表</a>
            </div>
            
            <div class="preview" id="preview">
                <h4>📋 数据预览</h4>
                
                <div class="stats-grid" id="statsGrid"></div>
                
                <div class="chart-container">
                    <h4>📊 山积图（各工位工时累计）</h4>
                    <div class="chart-wrapper">
                        <canvas id="stackChart"></canvas>
                    </div>
                </div>
                
                <div class="data-table" id="dataTable"></div>
            </div>
        </div>
        
        <div class="footer">五表一书生成器 v2.0 | 部品分厂</div>
    </div>

    <script>
        let uploadedFile = null;
        let parsedData = null;
        let chartInstance = null;
        
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const generateBtn = document.getElementById('generateBtn');
        const result = document.getElementById('result');
        const preview = document.getElementById('preview');
        
        uploadArea.addEventListener('click', () => fileInput.click());
        uploadArea.addEventListener('dragover', (e) => { e.preventDefault(); uploadArea.classList.add('dragover'); });
        uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) handleFile(e.target.files[0]);
        });
        
        function handleFile(file) {
            if (!file.name.match(/\.xlsx?$/i)) {
                showError('请上传Excel文件(.xlsx格式)');
                return;
            }
            
            uploadedFile = file;
            uploadArea.innerHTML = `
                <div class="icon">✅</div>
                <h3>${file.name}</h3>
                <p>文件大小: ${(file.size / 1024).toFixed(1)} KB</p>
                <p style="margin-top:8px;color:#667eea">点击重新选择</p>
            `;
            
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    parsedData = parseWorkInstruction(workbook);
                    
                    if (parsedData.stations.length > 0) {
                        generateBtn.disabled = false;
                        showPreview(parsedData);
                        if (parsedData.productModel && !document.getElementById('productModel').value) {
                            document.getElementById('productModel').value = parsedData.productModel;
                        }
                    } else {
                        showError('未能识别到工位数据，请检查文件格式');
                    }
                } catch (err) {
                    console.error(err);
                    showError('文件解析失败: ' + err.message);
                }
            };
            reader.readAsArrayBuffer(file);
        }
        
        function parseWorkInstruction(workbook) {
            const stations = [];
            let productModel = '';
            
            workbook.SheetNames.forEach((sheetName) => {
                const sheet = workbook.Sheets[sheetName];
                const jsonData = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
                
                if (jsonData.length < 10) return;
                
                // 提取TT (Row 2, Col 15)
                let tt = 33;
                if (jsonData[2] && jsonData[2][15]) {
                    tt = parseInt(jsonData[2][15]) || 33;
                }
                
                // 提取标准手持数 (Row 4, Col 13)
                let stdHandheld = 1;
                if (jsonData[4] && jsonData[4][13]) {
                    stdHandheld = parseInt(jsonData[4][13]) || 1;
                }
                
                // 提取工位名称 (Row 2, Col 3)
                let stationName = '';
                if (jsonData[2] && jsonData[2][3]) {
                    stationName = String(jsonData[2][3]);
                }
                
                // 自动识别产品型号
                if (!productModel && stationName) {
                    const match = stationName.match(/^(AT\d+\w*)/);
                    if (match) productModel = match[1];
                }
                
                // 提取各步骤数据 (Row 7-12)
                const steps = [];
                for (let row = 7; row <= 12; row++) {
                    if (jsonData[row]) {
                        const stepName = jsonData[row][2] ? String(jsonData[row][2]).trim() : '';
                        const stepTime = jsonData[row][7] ? parseFloat(jsonData[row][7]) : null;
                        steps.push({
                            name: stepName,
                            time: isNaN(stepTime) ? null : stepTime
                        });
                    } else {
                        steps.push({ name: '', time: null });
                    }
                }
                
                // 计算总工时 = 该岗位所有步骤之和
                const totalTime = steps.reduce((sum, s) => sum + (s.time || 0), 0);
                
                stations.push({
                    sheet: sheetName,
                    stationName: stationName,
                    tt: tt,
                    stdHandheld: stdHandheld,
                    steps: steps,
                    totalTime: totalTime
                });
            });
            
            // 工序周期时间 = 所有岗位工时之和
            const cycleTime = stations.reduce((sum, s) => sum + s.totalTime, 0);
            
            // 瓶颈时间 = TT
            const bottleneckTime = stations.length > 0 ? stations[0].tt : 33;
            
            // 线平衡率 = 工序周期时间 / (瓶颈时间 × 人数)
            const numPeople = stations.length;
            const balanceRate = numPeople > 0 ? cycleTime / (bottleneckTime * numPeople) : 0;
            
            return { stations, productModel, cycleTime, bottleneckTime, balanceRate };
        }
        
        function showPreview(data) {
            const { stations, cycleTime, bottleneckTime, balanceRate } = data;
            
            // 统计卡片
            document.getElementById('statsGrid').innerHTML = `
                <div class="stat-card">
                    <div class="value">${stations.length}</div>
                    <div class="label">人数/工位数</div>
                </div>
                <div class="stat-card">
                    <div class="value">${cycleTime}s</div>
                    <div class="label">工序周期时间</div>
                </div>
                <div class="stat-card">
                    <div class="value">${bottleneckTime}s</div>
                    <div class="label">瓶颈时间(TT)</div>
                </div>
                <div class="stat-card">
                    <div class="value">${(balanceRate * 100).toFixed(1)}%</div>
                    <div class="label">线平衡率</div>
                </div>
            `;
            
            // 山积图
            if (chartInstance) chartInstance.destroy();
            const ctx = document.getElementById('stackChart').getContext('2d');
            
            const labels = stations.map((s, i) => `OP${i + 1}`);
            const stepColors = ['#667eea', '#764ba2', '#f093fb', '#4facfe', '#43e97b', '#fa709a'];
            
            // 构建堆叠数据
            const datasets = [];
            for (let stepIdx = 0; stepIdx < 6; stepIdx++) {
                const stepData = stations.map(s => {
                    const step = s.steps[stepIdx] || { time: null };
                    return step.time || 0;
                });
                if (stepData.some(v => v > 0)) {
                    datasets.push({
                        label: `步骤${stepIdx + 1}`,
                        data: stepData,
                        backgroundColor: stepColors[stepIdx],
                        stack: 'stack0'
                    });
                }
            }
            
            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: { labels, datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: { stacked: true },
                        y: { 
                            stacked: true,
                            beginAtZero: true,
                            title: { display: true, text: '工时(秒)' }
                        }
                    },
                    plugins: {
                        legend: { position: 'top' },
                        title: { display: false }
                    }
                }
            });
            
            // 数据表格
            let html = '<table><thead><tr><th>工位</th><th>名称</th><th>步骤1</th><th>步骤2</th><th>步骤3</th><th>总工时</th><th>负荷率</th></tr></thead><tbody>';
            stations.forEach((s, i) => {
                const loadRate = bottleneckTime > 0 ? (s.totalTime / bottleneckTime * 100).toFixed(1) : 0;
                const loadColor = loadRate > 100 ? '#f44336' : loadRate > 90 ? '#ff9800' : '#4caf50';
                html += `<tr>
                    <td>OP${i + 1}</td>
                    <td>${s.stationName.substring(0, 12)}</td>
                    <td>${s.steps[0]?.time || '-'}</td>
                    <td>${s.steps[1]?.time || '-'}</td>
                    <td>${s.steps[2]?.time || '-'}</td>
                    <td><b>${s.totalTime}</b></td>
                    <td style="color:${loadColor};font-weight:bold">${loadRate}%</td>
                </tr>`;
            });
            html += '</tbody></table>';
            document.getElementById('dataTable').innerHTML = html;
            preview.classList.add('show');
        }
        
        function showError(msg) {
            result.className = 'result error show';
            document.getElementById('resultTitle').textContent = '❌ 错误';
            document.getElementById('resultInfo').textContent = msg;
        }
        
        generateBtn.addEventListener('click', () => {
            if (!parsedData) return;
            
            const config = {
                workshop: document.getElementById('workshop').value,
                lineName: document.getElementById('lineName').value,
                productModel: document.getElementById('productModel').value || parsedData.productModel || '充电座',
                author: document.getElementById('author').value
            };
            
            try {
                const wb = generateEmployeeLoadTable(parsedData, config);
                const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
                const blob = new Blob([wbout], { type: 'application/octet-stream' });
                const url = URL.createObjectURL(blob);
                const fileName = `员工负荷表_${config.productModel}_${new Date().toISOString().slice(0, 10)}.xlsx`;
                
                document.getElementById('downloadLink').href = url;
                document.getElementById('downloadLink').download = fileName;
                document.getElementById('resultTitle').textContent = '✅ 生成成功!';
                document.getElementById('resultInfo').innerHTML = `
                    共 ${parsedData.stations.length} 个工位<br>
                    工序周期时间: ${parsedData.cycleTime}秒 | 线平衡率: ${(parsedData.balanceRate * 100).toFixed(1)}%<br>
                    文件名: ${fileName}
                `;
                result.className = 'result show';
            } catch (err) {
                console.error(err);
                showError('生成失败: ' + err.message);
            }
        });
        
        function generateEmployeeLoadTable(data, config) {
            const { stations, cycleTime, bottleneckTime, balanceRate } = data;
            const wb = XLSX.utils.book_new();
            const wsData = [];
            const numStations = stations.length;
            
            // Row 1: 标题
            wsData.push([`${config.productModel}员工负荷表`]);
            
            // Row 2: 基本信息
            wsData.push(['车间', config.workshop, '', '产品型号', config.productModel, '', '工序周期时间', cycleTime, '', '人数', numStations, '', '编制人', config.author]);
            
            // Row 3: 线体信息
            const today = new Date();
            const dateStr = `${today.getFullYear()}.${today.getMonth() + 1}.${today.getDate()}`;
            wsData.push(['线体', config.lineName, '', '瓶颈时间', bottleneckTime, '', '线平衡率', balanceRate.toFixed(4), '', '目标拉速(s)', bottleneckTime, '', '编制时间', dateStr]);
            
            // Row 4: 空行
            wsData.push([]);
            
            // Row 5: 工序行
            const headerRow = ['工序'];
            stations.forEach((s, i) => {
                let name = s.stationName;
                if (name.startsWith('OP')) {
                    let idx = 2;
                    while (idx < name.length && /\d/.test(name[idx])) idx++;
                    name = name.substring(idx);
                }
                headerRow.push(`ML${i + 1}${name}`);
            });
            wsData.push(headerRow);
            
            // Row 6-11: 步骤1-6名称
            for (let stepIdx = 0; stepIdx < 6; stepIdx++) {
                const row = [`步骤${stepIdx + 1}`];
                stations.forEach(s => {
                    const step = s.steps[stepIdx] || { name: '' };
                    row.push(step.name || '');
                });
                wsData.push(row);
            }
            
            // Row 12: 总工时
            const totalRow = ['总工时'];
            stations.forEach(s => totalRow.push(s.totalTime));
            wsData.push(totalRow);
            
            // Row 13: 批量
            const batchRow = ['批量'];
            stations.forEach(() => batchRow.push(1));
            wsData.push(batchRow);
            
            // Row 14: 目标节拍
            const taktRow = ['目标节拍'];
            stations.forEach(() => taktRow.push(bottleneckTime));
            wsData.push(taktRow);
            
            // Row 15: 工序号
            const numRow = ['工序号'];
            stations.forEach((_, i) => numRow.push(i + 1));
            wsData.push(numRow);
            
            // Row 16-21: 步骤1-6工时
            for (let stepIdx = 0; stepIdx < 6; stepIdx++) {
                const row = [`步骤${stepIdx + 1}`];
                stations.forEach(s => {
                    const step = s.steps[stepIdx] || { time: null };
                    row.push(step.time || '');
                });
                wsData.push(row);
            }
            
            // Row 22: 空行
            wsData.push([]);
            
            // Row 23: 备注
            wsData.push(['※：为CTQ关键工序']);
            
            // 山积图数据区域（用于Excel图表）
            wsData.push([]);
            wsData.push(['山积图数据']);
            const chartLabels = ['工位'];
            const chartData = ['工时'];
            stations.forEach((s, i) => {
                chartLabels.push(`OP${i + 1}`);
                chartData.push(s.totalTime);
            });
            wsData.push(chartLabels);
            wsData.push(chartData);
            
            const ws = XLSX.utils.aoa_to_sheet(wsData);
            
            // 设置列宽
            ws['!cols'] = [{ wch: 12 }];
            for (let i = 0; i < numStations; i++) {
                ws['!cols'].push({ wch: 14 });
            }
            
            XLSX.utils.book_append_sheet(wb, ws, '员工负荷表');
            return wb;
        }
    </script>
</body>
</html>
